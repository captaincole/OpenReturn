<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How OpenReturn works: the Web App sends your words and documents to Cade; Cade sends tax facts and decisions to the Form Engine and asks Canon to check each decision against the IRS and FTB library; the engine sends the draft return and open questions back to the Web App</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- edges: the main loop -->
  <path d="M 370 128 C 300 180 230 220 210 276" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 336 334 L 538 334" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 276 C 650 220 580 180 510 128" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edges: Cade and Canon -->
  <path d="M 170 392 L 170 466" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 466 L 230 392" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 336 526 L 520 526" fill="none" stroke="#7d8590" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g fill="#7d8590" font-size="14" text-anchor="middle">
    <text x="190" y="176">your words</text>
    <text x="190" y="196">+ documents</text>
    <text x="437" y="318">tax facts + decisions</text>
    <text x="690" y="176">draft return</text>
    <text x="690" y="196">+ open questions</text>
    <text x="428" y="510">searches</text>
    <text x="428" y="550">cites</text>
  </g>
  <g fill="#7d8590" font-size="13.5">
    <text x="158" y="425" text-anchor="end">decisions</text>
    <text x="158" y="443" text-anchor="end">to check</text>
    <text x="242" y="425">verdicts</text>
    <text x="242" y="443">+ citations</text>
  </g>

  <!-- Web App (top center) -->
  <g>
    <rect x="310" y="24" width="260" height="104" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <text x="440" y="61" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🖥️ Web App</text>
    <text x="440" y="88" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">chat · upload documents</text>
    <text x="440" y="108" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">ask the tax code · watch progress</text>
  </g>

  <!-- Cade (middle left) -->
  <g>
    <rect x="64" y="278" width="272" height="112" rx="12" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
    <text x="200" y="316" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🤖 Cade — your AI CPA</text>
    <text x="200" y="342" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">interviews you · reads documents</text>
    <text x="200" y="362" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">records cited facts + decisions</text>
  </g>

  <!-- Form Engine (middle right) -->
  <g>
    <rect x="544" y="278" width="272" height="112" rx="12" fill="#059669" stroke="#065f46" stroke-width="2"/>
    <text x="680" y="316" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🧮 Form Engine</text>
    <text x="680" y="342" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">computes the 1040 + 540</text>
    <text x="680" y="362" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-size="13.5">pure rules · no AI</text>
  </g>

  <!-- Canon (bottom left) -->
  <g>
    <rect x="64" y="470" width="272" height="112" rx="12" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <text x="200" y="508" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">⚖️ Canon — your tax attorney</text>
    <text x="200" y="534" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-size="13.5">grounds every decision</text>
    <text x="200" y="554" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-size="13.5">answers tax-code questions</text>
  </g>

  <!-- the IRS + FTB library (bottom right) -->
  <g fill="none" stroke="#7d8590" stroke-width="2">
    <path d="M 530 494 L 530 562 A 70 14 0 0 0 670 562 L 670 494"/>
    <ellipse cx="600" cy="494" rx="70" ry="14"/>
  </g>
  <g fill="#7d8590" text-anchor="middle">
    <text x="600" y="530" font-size="15" font-weight="700">📚 IRS + FTB</text>
    <text x="600" y="550" font-size="13.5">reference library</text>
  </g>
</svg>
